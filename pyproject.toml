[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-search"
version = "0.1.0"
description = "Busca local de código Java multi-repo com embeddings híbridos (zero egress)"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3"]

[project.scripts]
code-search = "workflows.apps.code_search.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
